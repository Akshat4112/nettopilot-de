name: NP-A11Y-004 final one-time formatting
on:
  push:
    branches:
      - np-a11y-004-reduced-motion-regression

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write e2e/a11y-visual-preferences.spec.ts
      - name: Commit formatter result
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add e2e/a11y-visual-preferences.spec.ts
            git commit -m 'style: format strict contrast accessibility tests'
            git push origin HEAD:np-a11y-004-reduced-motion-regression
          fi
