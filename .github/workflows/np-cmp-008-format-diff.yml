name: NP-CMP-008 temporary formatting verification
on:
  push:
    branches:
      - np-cmp-008-remote-work

permissions:
  contents: read

jobs:
  show-formatting-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Print formatted patch for review
        run: |
          git diff -- src/components/OfferComparisonInputs.test.tsx src/components/OfferComparisonInputs.tsx src/components/RemoteWorkComparison.tsx src/domain/comparison/remote-work.ts e2e/offer-inputs.spec.ts
