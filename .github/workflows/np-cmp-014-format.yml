name: NP-CMP-014 one-time feature-branch formatting
on:
  push:
    branches:
      - np-cmp-014-private-comparison-sharing

permissions:
  contents: write

jobs:
  format-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply configured formatter to feature files
        run: |
          npx prettier --write src/components/offer-comparison-share.test.ts src/components/OfferComparisonShare.test.tsx src/components/OfferComparisonShare.tsx src/components/offer-comparison-share.ts src/components/OfferNetCompensation.tsx e2e/offer-private-sharing.spec.ts src/styles.css
          git diff --check
          git status --short
      - name: Commit feature-file formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/offer-comparison-share.test.ts src/components/OfferComparisonShare.test.tsx src/components/OfferComparisonShare.tsx src/components/offer-comparison-share.ts src/components/OfferNetCompensation.tsx e2e/offer-private-sharing.spec.ts src/styles.css
            git commit -m 'style: format NP-CMP-014 implementation'
            git push origin HEAD:np-cmp-014-private-comparison-sharing
          fi
