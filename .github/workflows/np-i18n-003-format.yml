name: NP-I18N-003 temporary feature formatter
on:
  push:
    branches:
      - np-i18n-003-english-content-review

permissions:
  contents: write

jobs:
  format-feature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format changed UI and regression files
        run: |
          npx prettier --write src/components/EssentialSalaryInputs.tsx src/components/EssentialSalaryInputs.test.tsx src/components/SalarySummary.tsx src/components/OfferComparisonSummary.tsx src/components/offer-comparison-share.ts src/components/offer-comparison-tradeoffs.ts src/components/CalculationMethodology.tsx src/components/OfferBenefitsInputs.tsx src/components/OfferComparisonSummary.test.tsx src/components/OfferComparisonTradeoffs.test.tsx src/components/OfferBenefitsInputs.test.tsx e2e/keyboard-navigation.spec.ts e2e/offer-benefits.spec.ts e2e/offer-net-compensation.spec.ts e2e/offer-primary-action.spec.ts e2e/offer-tradeoffs.spec.ts e2e/product-flow-contracts.spec.ts
          git diff --check
      - name: Commit formatting on feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components e2e
            git commit -m 'style: format English-content review changes'
            git push origin HEAD:np-i18n-003-english-content-review
          fi
