name: NP-I18N-003 temporary test formatter
on:
  push:
    branches:
      - np-i18n-003-english-content-review

permissions:
  contents: write

jobs:
  format-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/components/FormSemantics.test.tsx src/components/OfferComparisonAction.test.tsx
          git diff --check
      - name: Commit formatted tests
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/FormSemantics.test.tsx src/components/OfferComparisonAction.test.tsx
            git commit -m 'style: format revised English-content assertions'
            git push origin HEAD:np-i18n-003-english-content-review
          fi
