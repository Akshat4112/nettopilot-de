name: NP-UX-004 temporary formatter
on:
  push:
    branches:
      - np-ux-004-validation-recovery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format validation changes
        run: |
          npx prettier --write src/components/EssentialSalaryInputs.tsx e2e/validation-recovery.spec.ts src/styles.css
          git diff --check
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/EssentialSalaryInputs.tsx e2e/validation-recovery.spec.ts src/styles.css
            git commit -m 'style: format validation recovery'
            git push origin HEAD:np-ux-004-validation-recovery
          fi
