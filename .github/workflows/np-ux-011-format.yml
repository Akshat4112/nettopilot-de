name: NP-UX-011 temporary screenshot-test formatter
on:
  push:
    branches:
      - np-ux-011-visual-audit-design-spec

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply project formatter
        run: |
          npx prettier --write e2e/visual-audit.spec.ts
          git diff --check
      - name: Commit and push formatted test
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add e2e/visual-audit.spec.ts
            git commit -m 'style: format visual-audit screenshots'
            git push origin HEAD:np-ux-011-visual-audit-design-spec
          fi
